<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // INYECCIÓN ULTRA-TEMPRANA (Fijar diseño antes de que el navegador pinte nada)
      (function() {
        try {
          const cache = localStorage.getItem('design_config_cache');
          let font = "'Inter', sans-serif";
          let cfg = null;

          if (cache) {
            cfg = JSON.parse(cache);
            if (cfg.fontFamily) font = cfg.fontFamily;
          }

          const fontMap = {
            "'Inter', sans-serif": "Inter:wght@400;500;600;700",
            "'Playfair Display', serif": "Playfair+Display:ital,wght@0,400;0,600;1,400",
            "'Outfit', sans-serif": "Outfit:wght@400;500;600;700",
            "'Gochi Hand', cursive": "Gochi+Hand",
            "'Cinzel', serif": "Cinzel:wght@400;600;700",
            "'Montserrat', sans-serif": "Montserrat:wght@400;500;600;700",
            "'Lora', serif": "Lora:ital,wght@0,400;0,600;1,400",
            "'Roboto Slab', serif": "Roboto+Slab:wght@400;600;700",
            "'Bebas Neue', sans-serif": "Bebas+Neue",
            "'Quicksand', sans-serif": "Quicksand:wght@400;500;600;700"
          };
          const googleFont = fontMap[font] || "Inter:wght@400;500;600;700";
          const fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.id = 'dynamic-font';
          fontLink.href = 'https://fonts.googleapis.com/css2?family=' + googleFont + '&display=swap';
          document.head.appendChild(fontLink);

          if (cfg) {
            const root = document.documentElement;
            const isSuperAdmin = window.location.pathname.startsWith('/superadmin');
            const isAdmin = window.location.pathname.startsWith('/admin') && !isSuperAdmin;
            const isPortal = !window.location.pathname.startsWith('/admin') && !isSuperAdmin;

            if (isSuperAdmin) return;

            const s = document.createElement('style');
            s.id = 'ultra-early-style';
            const primary = cfg.primaryColor || '#3b82f6';
            const secondary = cfg.secondaryColor || '#2563eb';
            const bg = cfg.backgroundColor || '#f3f4f6';
            const text = cfg.primaryTextColor || '#ffffff';
            const generalText = cfg.generalTextColor || '#111827';

            s.innerHTML = `
              :root {
                --primary-color: ${primary} !important;
                --secondary-color: ${secondary} !important;
                --bg-color: ${bg} !important;
                --font-family: ${font} !important;
                --primary-text-color: ${text} !important;
                --text-primary: ${generalText} !important;
              }
              body { font-family: var(--font-family) !important; background-color: var(--bg-color) !important; color: var(--text-primary) !important; }
              .btn-primary, .app-topbar__user, button[type="submit"] { background-color: var(--primary-color) !important; color: var(--primary-text-color) !important; }
              .login-page { background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%) !important; }
              ${isPortal ? (cfg.customCssCustomer || '') : ''}
              ${isAdmin ? (cfg.customCssAdmin || '') : ''}
            `;
            document.head.appendChild(s);

            root.style.setProperty('--primary-color', primary, 'important');
            root.style.setProperty('--secondary-color', secondary, 'important');
            root.style.setProperty('--bg-color', bg, 'important');
            root.style.setProperty('--text-primary', generalText, 'important');
            root.style.setProperty('--font-family', font, 'important');

            // Actualizar color de la barra de sistema (Android) de forma inmediata
            const metaTheme = document.getElementById('meta-theme-color');
            if (metaTheme) metaTheme.content = primary;

            // Inyectar apple-touch-icon ultra-temprano para iOS
            const appleIconUrl = cfg.pwaIcon || cfg.faviconUrl;
            if (appleIconUrl) {
              const appleIcon = document.createElement('link');
              appleIcon.rel = 'apple-touch-icon';
              appleIcon.href = appleIconUrl;
              document.head.appendChild(appleIcon);
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" id="dynamic-favicon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de gestión de reservas white-label" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="transparent" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="dynamic-manifest" href="/manifest.json" />
    <title>Gestor de Reservas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
