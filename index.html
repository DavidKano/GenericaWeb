<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="dynamic-favicon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de gestión de reservas white-label" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#3b82f6" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="dynamic-manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Gochi+Hand&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    
    <script>
      // INYECCIÓN TEMPRANA DE IDENTIDAD (Elimina el lag de 30s)
      (function() {
        try {
          const cache = localStorage.getItem('design_config_cache');
          if (cache) {
            const cfg = JSON.parse(cache);
            const root = document.documentElement;
            const isPortal = !window.location.pathname.startsWith('/admin') && !window.location.pathname.startsWith('/superadmin');

            if (cfg.primaryColor) root.style.setProperty('--primary-color', cfg.primaryColor, 'important');
            if (cfg.secondaryColor) root.style.setProperty('--secondary-color', cfg.secondaryColor, 'important');
            if (cfg.primaryTextColor) root.style.setProperty('--primary-text-color', cfg.primaryTextColor, 'important');
            if (cfg.backgroundColor) root.style.setProperty('--bg-color', cfg.backgroundColor, 'important');
            if (cfg.fontFamily) root.style.setProperty('--font-family', cfg.fontFamily, 'important');

            if (isPortal && cfg.customCssCustomer) {
              const s = document.createElement('style');
              s.id = 'early-custom-css';
              s.innerHTML = cfg.customCssCustomer;
              document.head.appendChild(s);
            }
            
            // Favicon y Theme Color rápidos
            if (cfg.primaryColor) document.querySelector('meta[name="theme-color"]').setAttribute('content', cfg.primaryColor);
            if (cfg.faviconUrl) {
              const fav = document.getElementById('dynamic-favicon');
              if (fav) fav.href = cfg.faviconUrl;
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>Gestor de Reservas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
